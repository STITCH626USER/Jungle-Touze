<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
      .text-neon {
        font-family: 'Outfit', sans-serif;
        font-weight: 900;
        text-anchor: middle;
        fill: #fff;
      }
      .text-jungle {
        font-size: 80px;
        stroke: #00e5ff;
        stroke-width: 4px;
        filter: drop-shadow(0 0 15px #00e5ff) drop-shadow(0 0 30px #00e5ff);
      }
      .text-touze {
        font-size: 80px;
        stroke: #ff3366;
        stroke-width: 4px;
        filter: drop-shadow(0 0 15px #ff3366) drop-shadow(0 0 30px #ff3366);
      }
    </style>
  </defs>
  
  <text x="300" y="90" class="text-neon text-jungle">JUNGLE</text>
  <text x="300" y="175" class="text-neon text-touze">TOUZE</text>
</svg>

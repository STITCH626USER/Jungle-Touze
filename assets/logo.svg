<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <defs>
    <filter id="neon-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur3"/>
      <feMerge><feMergeNode in="blur3"/><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur3"/>
      <feMerge><feMergeNode in="blur3"/><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- JUNGLE glow layer -->
  <text x="260" y="88" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="88" font-weight="900" letter-spacing="4" fill="none" stroke="#00E5FF" stroke-width="6" opacity="0.22" filter="url(#neon-cyan)">JUNGLE</text>
  <!-- JUNGLE main -->
  <text x="260" y="88" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="88" font-weight="900" letter-spacing="4" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.88" filter="url(#neon-cyan)">JUNGLE</text>
  <!-- JUNGLE hot core -->
  <text x="260" y="88" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="88" font-weight="900" letter-spacing="4" fill="none" stroke="rgba(200,255,255,0.9)" stroke-width="1.2">JUNGLE</text>

  <!-- Leaf motif neon green -->
  <path d="M 242 118 C 248 98 260 90 260 90 C 260 90 272 98 278 118 C 269 107 260 103 251 107 Z" fill="none" stroke="#39FF14" stroke-width="2.5" filter="url(#neon-green)" opacity="0.95"/>
  <line x1="260" y1="90" x2="260" y2="118" stroke="#39FF14" stroke-width="1.5" opacity="0.8" filter="url(#neon-green)"/>
  <line x1="260" y1="97" x2="253" y2="109" stroke="#39FF14" stroke-width="1" opacity="0.6"/>
  <line x1="260" y1="97" x2="267" y2="109" stroke="#39FF14" stroke-width="1" opacity="0.6"/>
  <line x1="125" y1="108" x2="234" y2="108" stroke="#39FF14" stroke-width="1.5" opacity="0.45" filter="url(#neon-green)"/>
  <line x1="286" y1="108" x2="395" y2="108" stroke="#39FF14" stroke-width="1.5" opacity="0.45" filter="url(#neon-green)"/>
  <circle cx="122" cy="108" r="2.5" fill="#39FF14" opacity="0.7" filter="url(#neon-green)"/>
  <circle cx="398" cy="108" r="2.5" fill="#39FF14" opacity="0.7" filter="url(#neon-green)"/>

  <!-- TOUZE glow -->
  <text x="260" y="188" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" letter-spacing="8" fill="none" stroke="#FF3366" stroke-width="5" opacity="0.22" filter="url(#neon-pink)">TOUZE</text>
  <!-- TOUZE main -->
  <text x="260" y="188" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" letter-spacing="8" fill="none" stroke="#FF3366" stroke-width="2.8" opacity="0.92" filter="url(#neon-pink)">TOUZE</text>
  <!-- TOUZE hot core -->
  <text x="260" y="188" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" letter-spacing="8" fill="none" stroke="rgba(255,190,210,0.85)" stroke-width="1">TOUZE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
      .text-neon {
        font-family: 'Outfit', sans-serif;
        font-weight: 900;
        text-anchor: middle;
        fill: #fff;
      }
      .text-jungle {
        font-size: 70px;
        stroke: #00e5ff;
        stroke-width: 4px;
        filter: drop-shadow(0 0 15px #00e5ff) drop-shadow(0 0 30px #00e5ff);
      }
      .text-touze {
        font-size: 70px;
        stroke: #ff3366;
        stroke-width: 4px;
        filter: drop-shadow(0 0 15px #ff3366) drop-shadow(0 0 30px #ff3366);
      }
      .neon-tube {
        fill: none;
        stroke: #00e5ff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5px;
        filter: drop-shadow(0 0 4px #00e5ff) drop-shadow(0 0 10px #00e5ff);
      }
      .card-border {
        fill: none;
        stroke: #00e5ff;
        stroke-width: 8px;
        rx: 30px;
        filter: drop-shadow(0 0 10px #00e5ff);
      }
      .card-border-inner {
        fill: none;
        stroke: #ff3366;
        stroke-width: 3px;
        rx: 20px;
        filter: drop-shadow(0 0 8px #ff3366);
      }
      .bg {
        fill: #0F0F1A;
        rx: 40px;
      }
    </style>
    <linearGradient id="sunsetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="50%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#cc00ff" />
    </linearGradient>
    <g id="synth-sunset">
      <circle cx="100" cy="100" r="100" fill="url(#sunsetGrad)" filter="drop-shadow(0 0 15px #ff3366)" />
      <line x1="0" y1="120" x2="200" y2="120" stroke="#0F0F1A" stroke-width="4" />
      <line x1="0" y1="140" x2="200" y2="140" stroke="#0F0F1A" stroke-width="6" />
      <line x1="0" y1="165" x2="200" y2="165" stroke="#0F0F1A" stroke-width="8" />
      <line x1="0" y1="195" x2="200" y2="195" stroke="#0F0F1A" stroke-width="12" />
    </g>
    <g id="neon-palm">
      <path d="M13 8c0-2.76-2.46-5-5.5-5S2 5.24 2 8h2l1-1 1 1h4" />
      <path d="M13 7.14A5.82 5.82 0 0 1 16.5 6c3.04 0 5.5 2.24 5.5 5h-3l-1-1-1 1h-3" />
      <path d="M5.89 9.71c-2.15 2.15-2.3 5.47-.35 7.43l4.24-4.25.7-.7.71-.71 2.12-2.12c-1.95-1.96-5.27-1.8-7.42.35" />
      <path d="M11 15.5c.5 2.5-.17 4.5-1 6.5h4c2-5.5-.5-12-1-14" />
    </g>
  </defs>
  
  <rect width="400" height="600" class="bg" />
  <rect x="20" y="20" width="360" height="560" class="card-border" />
  <rect x="35" y="35" width="330" height="530" class="card-border-inner" />
  
  <!-- Centered sunset at x=100 (400/2 - 200/2), y=180 -->
  <g transform="translate(100, 180)" opacity="0.7">
    <use href="#synth-sunset" />
  </g>
  <!-- Palm tree at center x=200, y=180+40 = 220. Scale=4 (size 96). x=200-48=152 -->
  <g transform="translate(152, 210) scale(4)" opacity="0.9">
    <use href="#neon-palm" class="neon-tube" />
  </g>
  
  <text x="200" y="295" class="text-neon text-jungle">JUNGLE</text>
  <text x="200" y="385" class="text-neon text-touze">TOUZE</text>
</svg>

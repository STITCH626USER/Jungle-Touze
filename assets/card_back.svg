<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
      .text-neon {
        font-family: 'Outfit', sans-serif;
        font-weight: 900;
        text-anchor: middle;
        fill: #fff;
      }
      .text-jungle {
        font-size: 70px;
        stroke: #00e5ff;
        stroke-width: 4px;
        filter: drop-shadow(0 0 15px #00e5ff) drop-shadow(0 0 30px #00e5ff);
      }
      .text-touze {
        font-size: 70px;
        stroke: #ff3366;
        stroke-width: 4px;
        filter: drop-shadow(0 0 15px #ff3366) drop-shadow(0 0 30px #ff3366);
      }
      .palm-tree {
        font-size: 140px;
        filter: drop-shadow(0 0 25px #00e5ff) drop-shadow(0 0 45px #00e5ff);
      }
      .card-border {
        fill: none;
        stroke: #00e5ff;
        stroke-width: 8px;
        rx: 30px;
        filter: drop-shadow(0 0 10px #00e5ff);
      }
      .card-border-inner {
        fill: none;
        stroke: #ff3366;
        stroke-width: 3px;
        rx: 20px;
        filter: drop-shadow(0 0 8px #ff3366);
      }
      .bg {
        fill: #0F0F1A;
        rx: 40px;
      }
    </style>
  </defs>
  
  <rect width="400" height="600" class="bg" />
  <rect x="20" y="20" width="360" height="560" class="card-border" />
  <rect x="35" y="35" width="330" height="530" class="card-border-inner" />
  
  <text x="200" y="360" class="text-neon palm-tree" opacity="0.25">🌴</text>
  <text x="200" y="275" class="text-neon text-jungle">JUNGLE</text>
  <text x="200" y="365" class="text-neon text-touze">TOUZE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playball&amp;family=Montserrat:wght@200;700&amp;display=swap');
      .neon-jungle {
        font-family: 'Playball', cursive;
        font-size: 110px;
        fill: #ffffff;
        text-anchor: middle;
        stroke: #f8a5c2;
        stroke-width: 2px;
        filter: drop-shadow(0 0 8px #e15f41) drop-shadow(0 0 25px #e15f41) drop-shadow(0 0 50px #e15f41);
      }
      .neon-touze {
        font-family: 'Montserrat', sans-serif;
        font-weight: 200;
        font-size: 40px;
        letter-spacing: 20px;
        fill: #ffffff;
        text-anchor: middle;
        stroke: #a29bfe;
        stroke-width: 1.5px;
        filter: drop-shadow(0 0 6px #6c5ce7) drop-shadow(0 0 20px #6c5ce7) drop-shadow(0 0 40px #6c5ce7);
      }
      .neon-border {
        fill: none;
        stroke: #6c5ce7;
        stroke-width: 4px;
        rx: 30px;
        filter: drop-shadow(0 0 10px #6c5ce7) drop-shadow(0 0 20px #6c5ce7);
      }
      .neon-border-inner {
        fill: none;
        stroke: #e15f41;
        stroke-width: 3px;
        rx: 20px;
        filter: drop-shadow(0 0 8px #e15f41) drop-shadow(0 0 15px #e15f41);
        opacity: 0.6;
      }
      .bg {
        fill: #0F0F1A;
        rx: 40px;
      }
    </style>
  </defs>
  
  <rect width="400" height="600" class="bg" />
  
  <rect x="20" y="20" width="360" height="560" class="neon-border" />
  <rect x="35" y="35" width="330" height="530" class="neon-border-inner" />
  
  <path d="M 100 100 Q 200 180 300 100" fill="none" stroke="#6c5ce7" stroke-width="2" filter="drop-shadow(0 0 5px #6c5ce7)" opacity="0.5" />
  <path d="M 100 500 Q 200 420 300 500" fill="none" stroke="#6c5ce7" stroke-width="2" filter="drop-shadow(0 0 5px #6c5ce7)" opacity="0.5" />
  
  <text x="200" y="320" class="neon-jungle">Jungle</text>
  <text x="210" y="390" class="neon-touze">TOUZE</text>
</svg>
